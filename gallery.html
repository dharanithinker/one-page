<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/responsive.css">
        <link rel="stylesheet" href="css/plugin.css">
        <link rel="stylesheet" href="css/font.css">
        <link rel="stylesheet" href="css/lightgallery.min.css">
        <link rel="stylesheet" href="css/gallery.css">

        <!-- document title -->
        <title>Niaa - Gallery</title>
    </head>

    <body>
        <!-- MAIN WRAPPER START
            ============================================= -->
        <div class="main-wrapper clearfix">
            <!-- HEADER START
                ============================================= -->
            <header id="header">
                <div class="header-style1-wrap">
                    <div class="header-content-left">
                        <div class="logo">
                            <h2 class="logo-title">
                                <a href="niaa.html">
                                    <img
                                        src="img/niaa_logo.png"
                                        alt="AI Maayai Logo"
                                        class="logo-img niaa-logo-img" />
                                </a>
                            </h2>
                        </div>
                    </div>

                    <div class="header-content-right">
                        <nav class="main-nav col-span-9 sm:col-span-12">
                            <button class="jepret-menu-mobile">
                                <i class="icon icon-reorder"></i>
                            </button>

                            <ul id="main-menu" class="sm sm-clean mobile-menu">
                                <li><a href="contact.html" target="_blank">Book
                                        Demo</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </header>
            <!-- HEADER END -->
            <!-- HEADER END -->
            <!-- Content -->
            <div class="content">
                <div class="top-bar"></div>
                <div class="left-bar"></div>
                <div class="right-bar"></div>

                <div class="carousel-block gallery-carousel-block">
                    <div class="column column-25 carousel-title-wrap">
                        <div class="title-wrap">

                        </div>
                        <div class="detail-wrap">
                            <h3 class="the-title">
                                What's Possible with NIAA
                            </h3>
                        </div>
                        <div class="desc-wrap">
                            <p class="the-desc">
                                Discover a showcase of creative experiences that
                                can be designed and delivered using NIAA. From
                                AI-powered transformations to interactive photo
                                experiences, this gallery highlights the
                                versatility and possibilities of the platform
                            </p>
                        </div>
                    </div>
                    <div class="column column-75 carousel-wrap">
                        <div class="swiper-container carousel-album">
                            <div class="swiper-wrapper">
                            </div>
                            <div class="swiper-scrollbar"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end Content -->
            <!-- Footer -->

            <!-- end Footer -->
        </div>

        <!-- Footer Scripts
            ============================================= -->
        <!-- JavaScripts
        ============================================= -->
        <script src="js/jquery-3.6.0.min.js"></script>
        <script src="js/jquery.smartmenus.min.js"></script>
        <script src="js/aos.js"></script>
        <script src="js/swiper-bundle.min.js"></script>
        <script src="js/isotope.js"></script>
        <script src="js/imagesloaded.pkgd.min.js"></script>
        <script src="js/lightgallery-all.min.js"></script>
        <script src="js/gallery-carousel.js"></script>
        <script src="js/main.js"></script>
    </body>

</html>
